services:
  postgres:
    profiles: [integration]
    image: postgres:18.6
    environment:
      POSTGRES_DB: cloudplayground
      POSTGRES_USER: cloudplayground
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cloudplayground-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudplayground -d cloudplayground"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
