name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.yml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  validate-docs:
    name: validate-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.3"
      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = list(Path('.github').rglob('*.yml')) + list(Path('.github').rglob('*.yaml'))
          for path in files:
              content = path.read_text(encoding='utf-8')
              if path.name == 'docs.yml':
                  content = content.replace('\non:', '\n"on":', 1)
              yaml.safe_load(content)
          print(f'Validated {len(files)} YAML files')
          PY
      - name: Check Markdown links and whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          errors = []
          files = list(Path('.').rglob('*.md'))
          for path in files:
              text = path.read_text(encoding='utf-8')
              for number, line in enumerate(text.splitlines(), 1):
                  if line.rstrip() != line:
                      errors.append(f'{path}:{number}: trailing whitespace')
                  for target in re.findall(r'\[[^\]]*\]\(([^)]+)\)', line):
                      if target.startswith(('http://', 'https://', '#', 'mailto:')):
                          continue
                      target_path = (path.parent / target.split('#', 1)[0]).resolve()
                      if not target_path.exists():
                          errors.append(f'{path}:{number}: broken local link {target}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(files)} Markdown files')
          PY
