name: Application CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "src/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "compose.yaml"
      - "README.md"
      - "Dockerfile"
      - ".github/verify-maven-wrapper.ps1"
      - ".github/workflows/application.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "src/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "compose.yaml"
      - "README.md"
      - "Dockerfile"
      - ".github/verify-maven-wrapper.ps1"
      - ".github/workflows/application.yml"

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: 25.0.5+8
          cache: maven
      - name: Verify Maven Wrapper distribution checksum
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw --version
          distribution="$HOME/.m2/wrapper/dists/apache-maven-3.10.0"
          archive=$(find "$distribution" -type f -name 'apache-maven-3.10.0-bin.zip' -print -quit)
          test -n "$archive"
          printf '%s  %s\n' '22d31676d5b92ed53308c19ecded3245d0efd0cddfec51ec7bab62f4f13ad70ddddceff8e62940e0e8e2421f3cde8106737f4becec0aa034ffeff2a754e88337' "$archive" | sha512sum --check --status
          echo 'Maven distribution SHA-512 verified.'
      - name: Verify and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
