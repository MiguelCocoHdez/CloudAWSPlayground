name: Tarea
description: Cambio pequeño con alcance y evidencia claros
title: "[TAREA] "
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Qué problema o necesidad se atiende
      placeholder: Resultado que se quiere conseguir
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance
      description: Incluye y excluye explícitamente
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Resultados observables y verificables
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Pruebas y evidencia
      description: Comprobaciones que demostrarán el resultado
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias, riesgos y decisiones
      description: Bloqueos o ADR que haya que aprobar
    validations:
      required: false
